services:
  api:
    build: .
    environment:
      REGURAG_APP_ENV: local
      REGURAG_CHUNKS_PATH: /app/data/processed/chunks.jsonl
      REGURAG_TOP_K: 5
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
