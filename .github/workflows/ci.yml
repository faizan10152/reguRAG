name: ci

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run project guards
        run: uv run python scripts/check_project_guards.py --all-files
      - name: Run tests
        run: uv run pytest
      - name: Run lint
        run: uv run ruff check .
